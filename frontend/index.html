<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Language Translator1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        textarea {
            width: 90%;
            margin-bottom: 10px;
        }
        select, button {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>Language Translator</h1>
    <textarea id="inputText" rows="5" placeholder="Enter text to translate..."></textarea><br>

    <select id="language">
        <option value="gujarati">Gujarathi</option>
        <option value="hindi">Hindi</option>
        <option value="french">French</option>
        <option value="german">German</option>
        <option value="spanish">Spanish</option>
        <option value="japanese">Japanese</option>
        <option value="chinese (simplified)">Chinese (Simplified)</option>
        <option value="english">English</option>
    </select>

    <button onclick="translateText()">Translate</button>

    <h2>Translated Text</h2>
    <textarea id="outputText" rows="5" readonly></textarea>

    <script>
        async function translateText() {
            const inputText = document.getElementById('inputText').value;
            const targetLang = document.getElementById('language').value;

            if (!inputText) {
                alert("Please enter text.");
                return;
            }

            try {
                const response = await fetch("http://127.0.0.1:5000/translate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        text: inputText,
                        target_language: targetLang
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('outputText').value = data.translated_text;
                } else {
                    alert("Error: " + data.error);
                }

            } catch (err) {
                alert("Error: Could not connect to server.\n" + err);
            }
        }
    </script>

</body>
</html>
